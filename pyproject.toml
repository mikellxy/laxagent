[project]
name = "laxcode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "fastapi>=0.121,<1",
    "httpx2[socks]>=2.16.0",
    "langgraph>=1.2.20",
    "nats-py>=2.16.0",
    "openai>=3.46.0",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not sandbox_linux'"
markers = ["sandbox_linux: real Linux/bubblewrap acceptance; run explicitly with -m sandbox_linux, never skip missing dependencies"]

[project]
name = "laxcode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.16.0",
    "fastapi>=0.121,<1",
    "httpx2[socks]>=2.16.0",
    "openai>=3.46.0",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
